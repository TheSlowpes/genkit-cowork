version: '3'

tasks:
  setup:
    desc: Download Go module dependencies
    cmds:
      - go mod download

  fmt:
    desc: Format Go source
    cmds:
      - go fmt ./...

  check:
    desc: Check Go formatting and run go vet
    cmds:
      - |
        unformatted=$(gofmt -l examples genkit-cowork) || exit 1
        if [ -n "$unformatted" ]; then
          printf 'Run task fmt. Unformatted files:\n%s\n' "$unformatted" >&2
          exit 1
        fi
      - go vet ./...

  test:
    desc: Run the Go unit tests without native Yzma assets
    env:
      YZMA_TEST_MODEL: ''
      YZMA_TEST_SPEECH_MODEL: ''
      YZMA_TEST_DECISION_MODEL: ''
      YZMA_TEST_AUDIO_MODEL: ''
    cmds:
      - go test ./...

  build:
    desc: Compile all Go packages and examples
    cmds:
      - go build ./...

  ci:
    desc: Run the same setup, checks, tests, and build as Linux CI
    cmds:
      - task: setup
      - task: check
      - task: test
      - task: build

  dev:
    desc: Run the terminal chat example with GEMINI_API_KEY and optional READ_ONLY
    cmds:
      - ': "${GEMINI_API_KEY:?Set GEMINI_API_KEY before running task dev}"'
      - go run ./examples/tui-chat

  dev:pgvector:
    desc: Run the pgvector demo against a disposable database with PGVECTOR_DSN
    cmds:
      - ': "${PGVECTOR_DSN:?Set PGVECTOR_DSN to a disposable demo database}"'
      - go run ./examples/pgvector

  dev:yzma:
    desc: Run the Yzma example with YZMA_LIB and model flags after --
    cmds:
      - go run ./examples/yzma-loading {{.CLI_ARGS}}

  dev:yzma:ui:
    desc: Run the Yzma example in Genkit Dev UI with YZMA_LIB and model flags after --
    cmds:
      - genkit start -- go run ./examples/yzma-loading -serve {{.CLI_ARGS}}

  test:yzma:race:
    desc: Run Yzma unit tests with the Go race detector
    env:
      YZMA_TEST_MODEL: ''
      YZMA_TEST_SPEECH_MODEL: ''
      YZMA_TEST_DECISION_MODEL: ''
      YZMA_TEST_AUDIO_MODEL: ''
    cmds:
      - go test -race ./genkit-cowork/plugins/yzma

  test:yzma:native:
    desc: Run native Yzma tests with YZMA_LIB and YZMA_TEST_MODEL. Pass -run after -- to narrow the selection
    cmds:
      - ': "${YZMA_LIB:?Set YZMA_LIB to the native library directory}"'
      - ': "${YZMA_TEST_MODEL:?Set YZMA_TEST_MODEL to a local GGUF model}"'
      - go test ./genkit-cowork/plugins/yzma -run '^TestNative' -v {{.CLI_ARGS}}

  dev:yzma:structured:
    desc: Run the Yzma structured output example with YZMA_LIB and a local GGUF
    cmds:
      - go run ./examples/yzma-structured {{.CLI_ARGS}}

  dev:yzma:video:
    desc: Ask a local Yzma vision model about an inline MP4
    cmds:
      - go run ./examples/yzma-video {{.CLI_ARGS}}

  dev:yzma:speech:
    desc: Save speech from a local Soprano GGUF pair with YZMA_LIB and model flags after --
    cmds:
      - go run ./examples/yzma-speech {{.CLI_ARGS}}

  test:yzma:speech:native:
    desc: Run native speech tests with YZMA_LIB, YZMA_TEST_SPEECH_MODEL, and YZMA_TEST_SPEECH_DECODER
    cmds:
      - ': "${YZMA_LIB:?Set YZMA_LIB to the native library directory}"'
      - ': "${YZMA_TEST_SPEECH_MODEL:?Set YZMA_TEST_SPEECH_MODEL to the Soprano backbone GGUF}"'
      - ': "${YZMA_TEST_SPEECH_DECODER:?Set YZMA_TEST_SPEECH_DECODER to the Soprano mmproj GGUF}"'
      - go test ./genkit-cowork/plugins/yzma -run '^TestNativeSpeech$' -v -count=1

  dev:yzma:vision:
    desc: Ask a local Yzma vision model about an inline image
    cmds:
      - go run ./examples/yzma-vision {{.CLI_ARGS}}

  dev:yzma:decision:
    desc: Run the Yzma decision example with YZMA_LIB and an installed System One GGUF
    cmds:
      - go run ./examples/yzma-decision {{.CLI_ARGS}}

  test:yzma:decision:native:
    desc: Run the native System One test with YZMA_LIB and YZMA_TEST_DECISION_MODEL
    cmds:
      - ': "${YZMA_LIB:?Set YZMA_LIB to the native library directory}"'
      - ': "${YZMA_TEST_DECISION_MODEL:?Set YZMA_TEST_DECISION_MODEL to a local System One GGUF}"'
      - go test ./genkit-cowork/plugins/yzma -run '^TestNativeDecision$' -count=1 -v

  dev:yzma:audio:
    desc: Transcribe an inline WAV with a local Yzma model
    cmds:
      - go run ./examples/yzma-audio {{.CLI_ARGS}}

  test:yzma:audio:native:
    desc: Transcribe a known WAV using the native Qwen3-ASR pair
    cmds:
      - ': "${YZMA_LIB:?Set YZMA_LIB to the native library directory}"'
      - ': "${YZMA_TEST_AUDIO_MODEL:?Set YZMA_TEST_AUDIO_MODEL to the Qwen3-ASR GGUF}"'
      - ': "${YZMA_TEST_AUDIO_PROJECTOR:?Set YZMA_TEST_AUDIO_PROJECTOR to its qwen3a projector GGUF}"'
      - ': "${YZMA_TEST_AUDIO_WAV:?Set YZMA_TEST_AUDIO_WAV to the fox.wav sample}"'
      - go test ./genkit-cowork/plugins/yzma -run '^TestNativeAudioInput$' -v -count=1
